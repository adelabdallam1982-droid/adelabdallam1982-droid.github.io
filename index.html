<div class="card">

```
<h1>🕋 رحلات العمرة</h1>

<p class="info">
    مرحباً بك في رحلة العمرة
</p>

<div id="tripInfo" class="trip-name">
    جاري تحميل الرحلة...
</div>

<p class="info">
    يمكنك فتح الرحلة من خلال تطبيق رحلات العمرة إذا كان التطبيق مثبتًا على جهازك.
</p>

<a id="openApp"
   class="button"
   href="#">
    فتح تطبيق رحلات العمرة
</a>
```

</div>

<script>

    // --------------------------------------------------
    // قراءة اسم الرحلة من الرابط
    // مثال:
    // /trip/riyadh-fall2026
    // --------------------------------------------------

    const path = window.location.pathname;

    let slug = "";

    if (path.startsWith("/trip/")) {
        slug = path.substring("/trip/".length).replace(/\/$/, "");
    }

    // عرض اسم الرحلة
    const tripInfo = document.getElementById("tripInfo");

    if (slug) {
        tripInfo.textContent = "رحلة: " + slug;
    } else {
        tripInfo.textContent = "لم يتم تحديد رحلة";
    }

    // --------------------------------------------------
    // رابط فتح التطبيق
    // --------------------------------------------------

    const openApp = document.getElementById("openApp");

    if (slug) {
        openApp.href =
            "https://adelabdallam1982-droid.github.io/trip/" + slug;
    } else {
        openApp.style.display = "none";
    }

</script>

</body>
</html>
