<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>رحلات العمرة</title>

</head>


<body>

    <h1>رحلات العمرة</h1>

    <p>
        جاري فتح الرحلة...
    </p>


    <script>

        /*
        ==================================================
        استخراج رقم الرحلة من الرابط
        مثال:
        /trip/riyadh-fall2026
        ==================================================
        */

        const path =
            window.location.pathname;


        const prefix =
            "/trip/";


        if (path.startsWith(prefix)) {

            const slug =
                path
                    .substring(prefix.length)
                    .split("/")[0];


            if (slug) {

                /*
                ==================================================
                تحويل الرابط إلى صفحة الرحلة الرئيسية
                مع إرسال رقم الرحلة
                ==================================================
                */

                const newUrl =
                    "/trip/?trip="
                    + encodeURIComponent(slug);


                window.location.replace(newUrl);

            }

        }

    </script>

</body>

</html>
