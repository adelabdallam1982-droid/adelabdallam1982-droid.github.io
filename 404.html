<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلات العمرة</title>
</head>

<body>
    <h1>رحلة العمرة</h1>

    <p>جاري فتح الرحلة من خلال تطبيق رحلات العمرة...</p>

    <script>
        const path = window.location.pathname;

        if (path.startsWith("/trip/")) {
            const slug = path.substring("/trip/".length);

            if (slug) {
                document.body.innerHTML +=
                    "<p>رقم الرحلة: <strong>" + slug + "</strong></p>";
            }
        }
    </script>
</body>
</html>
